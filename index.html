</style></head><body><main class="card"><div class="art" id="art" role="img" aria-label="Libélula en ilustración botánica de estilo antiguo"></div><section class="content"><div class="ornament" aria-hidden="true">❧</div><div class="eyebrow">UN MOMENTO PARA TI</div><div class="message" id="message" aria-live="polite"></div><div class="ornament" aria-hidden="true">❧</div><p class="signature">Pensando en ti con cariño, Ana</p><button class="button" id="next" type="button">Leer otro mensaje →</button><p class="foot">Cada paso cuenta. Gracias por regalarte este momento.</p><div class="dots" id="dots" aria-hidden="true"></div></section></main><script>
const messages=["Tus esfuerzos cuentan, incluso cuando los resultados todavía no se ven.", "Tu valor no depende de la opinión de otras personas. Mereces respeto y oportunidades.", "No tienes que hacerlo todo hoy. Un paso pequeño también es progreso.", "Tienes derecho a empezar de nuevo tantas veces como lo necesites.", "Hay fortaleza en pedir ayuda. No tienes que enfrentar todo en soledad.", "Tu historia continúa. Todavía puedes escribir capítulos llenos de posibilidades.", "Cada avance merece ser reconocido, incluso si parece pequeño.", "Mereces hablarte con la misma amabilidad que ofreces a los demás.", "No necesitas ser perfecto para ser valioso.", "Lo que hoy parece difícil puede volverse más manejable paso a paso.", "Tus sueños merecen espacio, aunque el camino tome tiempo.", "Puedes sentir miedo y aun así dar un paso hacia adelante.", "Compararte con otras personas no muestra todo lo que has superado.", "Tu bienestar importa. Descansar también es una forma de cuidarte.", "Cada día trae una nueva oportunidad de elegir lo que te hace bien.", "Tienes cualidades que merecen ser reconocidas, empezando por ti.", "Un tropiezo no borra todo lo que has logrado.", "No eres tus errores. También eres lo que aprendes de ellos.", "Mereces relaciones en las que puedas sentirte escuchado y respetado.", "Hay días para avanzar y días para recuperar fuerzas. Ambos cuentan.", "Tu voz importa. Tus ideas y necesidades merecen ser escuchadas.", "No minimices el esfuerzo que te ha traído hasta aquí.", "Puedes cambiar de rumbo sin perder el valor de lo que has recorrido.", "Reconocer tus límites es una forma de fortaleza.", "El progreso no siempre es una línea recta, y eso está bien.", "Permítete celebrar una pequeña victoria hoy.", "Tu ritmo es válido. No necesitas competir con el camino de nadie.", "Lo que piensas de ti puede convertirse en una fuente de apoyo.", "Hay posibilidades por descubrir, incluso si hoy todavía no las ves.", "Que este momento te recuerde que mereces cuidado, dignidad y esperanza."];const artImages=["data:image/webp;base64,UklGRthWAQBXRUJQVlA4IMxWAQBQ+AOdASoIApcCPnUskkYkoqGhstgNWJAOiWNiSKXT71fFs+yzIOFUOBKXr80N5PvhDyEUH0IIpIRwGqCNdtRbpGrF8vqeZNzLx1dMHFA6mz0/bu/P6cv7h6NXSZ83nnAepT/Cekd1V/oZ9NT/h9//5kf1XxK/NP4f/j+CfmK+T/vf+h/8f+c9yHFP7F/Xf/T/af7X2I/n/5k/rf5D2of2X/q/1vjP8yv+H/P+wR+af1z/m/4T1V/y//f/sP+D4QG2/8X/4f7b2C/dT73/5f8p/sPYC/I85vtv7AX9K/xHqp/5vDD9e9gL+yf7H9wPdg/0v/z/vP+D+9vuq/UP9z/9v9x8BH9E/wX7L+3n///fJ6QX7x//9Z9ufimr69d9903PJU9GWaDYQDGInY3ze2flFDMwVKYGi5FA8rpxxfwl8+gqzf1w+pPiFiHqjk1n1iXDOqFFzYQgBeinNZv7oyOxH4vw7vuTf2uRs2MyFSaXV0eWG7yepVDSJndOfN9N7J42845H7OIwlQvice1YcO+mUOe1NeBBktc4ltrWwW2tsYRcVJ5Mlf2RkMTRSW+HCnwaZy5+syC5DosxV0ldIPhY8aphbJTW9fpA1uvNWXX2KIL+xB1DUhPM0r+Xen0KHFCdaGQoD802VQPBe6LCltpjI5NbOtvJ9alc/lTH7O/KlL+2ZuSDP0JjCou5WnNKe64tYoSLK+AxIog1RVki6y4/0MGOCt1eBudYmEafk/1MjLY6dvF6ebPWUmq/GTUNKwXVoqBgCVitZZVZpvEuIhhy1dLaWu90Jm/sk5+JNV68WLuG4YQ9ePi/b/Epmcrt8VaQ53cl6m5Smr1I6M8/N/GlfR7KlKpkLHIHy9cGJV9UJnWmPJMP4D7G+KpSzN0DbqrzuUWeHUFkGisWYAhZBGS/lH6uF9dBE/dDrP2mbhEpxFHSTpMqRxT5vYRb2f140b0bXZy60r2586T1iNeTHfXgBzslYcBtr3cYwF0rJ1gc90Mbu+Kn+8Lsb5e54epRcpkr3PKmMIGKF7Oa5mYVoRuSS4uGX4iU5L8ducnG1knJ3zTs/aucGOXDMg6JdWiMgCiQea/Oz9g3ass1G6GVmW2M3useLww367BnXz10Q162ArrSJZJ/SBzOYraxsAIn8zOFeKZJP/7huPxhenmBKYR/zCnUqENlqsgjDNu0DYGcyxmiQbot47nS2OxGEfdkmeq1zdQA/pCUCyIjSwqbt4ZfVJ/srk28BWuyEIj/r8S34bssGdBpOQ/v6QXX7q6JIgZdeng8V7t1Lj85Lrwl6T56ahlEQ5Ds3tUDdvQWOeRD7RSuloBIjIDqBDLw7yH0vMCW8nTv1FWMMBMKLaY9dxFaOoIRagsQ2wGkKlvUgl2Yv9sdTe9bL+72L/Q6Eo/ag29k4SaAz+6yoDOWE2Mmqah/bV26IqonFLIiZwO+vpGdVtd6UwZZhQjVfUPavSa9u+K+lpyfLndd0LOCmRUR9/0CP5yE15Ht02awytnbKXbauBlHJuMvSPeJRoZJDY5DlbsE0MkTauqTGKerq6UNhxwY3/uHaCKxLdS9VhVyUngAgTyObX/VUILt1AsKeEJUwP8Wl6y+TF6e5QuHvepFAkL5Lfu8t3G6enK6rb11V1K3HvphouIn81lKMZfuf1tHVj+2sl/4b7bsuC9XnNt48ZqL2lRghGgplRBHw5davKV7eeADdolvVDVft6OQAZpmDs0g5bfPZivUmJV/qtJsVJrS2yzEAJSIOSaTxWnLmAU+whtcUeX9zpiJRR0+OwsOgD+DhvXmxOK/F8UBsb3zsfty1cw4Zfmkh5AMjObJU7MhRdCca5mVaAg85g5Dui4GJ+qv7vl5d46LzbXCDbcqMHnkfxJ72vNEPLrat+t6/UV6klhcGtiTt0
